# Compila la ROM nell'immagine devkitARM bloccata per digest (lo stesso di toolchain.lock),
# esegue gate e test, e carica la ROM con il suo SHA-256.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rom:
    runs-on: ubuntu-24.04
    container:
      image: devkitpro/devkitarm@sha256:116afba8df8453961de2936ffab20dd441edf4d682856c1ec8b0e53d7ed0bbf5
    env:
      PYTHON: python3
    steps:
      - name: Strumenti di base (git per il submodule, python3 per Butano e i test)
        run: |
          if ! command -v git > /dev/null || ! command -v python3 > /dev/null; then
            apt-get update
            apt-get install -y --no-install-recommends git python3 ca-certificates
          fi
          git --version
          python3 --version

      - name: Pillow per i generatori che disegnano (mappa della pausa)
        run: |
          if ! python3 -c "import PIL" 2> /dev/null; then
            apt-get update
            apt-get install -y --no-install-recommends python3-pil
          fi
          python3 -c "import PIL; print('Pillow', PIL.__version__)"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1, node24
        with:
          submodules: true

      - name: Il digest dell'immagine e' quello di toolchain.lock
        run: grep -qx "DOCKER_IMAGE=devkitpro/devkitarm@sha256:116afba8df8453961de2936ffab20dd441edf4d682856c1ec8b0e53d7ed0bbf5" toolchain.lock

      - name: Nessun test si salta da solo
        run: python3 tools/check_no_skip.py

      - name: Test (tutti, in parallelo per modulo; docs/prove.md)
        run: python3 tools/prove.py --tutte --senza-mgba

      - name: Ordine dei campi delle struct (docs/regole_sviluppo_gba.md, clang -m32)
        run: |
          if ! command -v clang++ > /dev/null || ! ls -d /usr/include/c++/* > /dev/null 2>&1; then
            apt-get update
            apt-get install -y --no-install-recommends clang g++ libc6-dev
          fi
          python3 tools/controlla_struct.py

      - name: Impronta della toolchain (per confrontare la build con quella del PC)
        run: |
          arm-none-eabi-gcc -v 2>&1 | tail -1 || "$DEVKITARM/bin/arm-none-eabi-gcc" -v 2>&1 | tail -1
          "$DEVKITARM/bin/arm-none-eabi-ld" -v
          (dkp-pacman -Q 2> /dev/null || pacman -Q 2> /dev/null) | grep -iE "devkitarm|gba|newlib|binutils|gcc" || true
          LIB="$DEVKITARM/arm-none-eabi/lib"
          sha256sum "$("$DEVKITARM/bin/arm-none-eabi-gcc" -print-libgcc-file-name)" "$LIB/libc.a" "$LIB/libstdc++.a" "$LIB/libm.a" "$LIB/gba_crt0.o" "$LIB/libsysbase.a" 2>&1 || true
          python3 --version

      - name: Build (toolchain.lock, compilazione, gate zero-heap, SHA-256)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/butano"
          bash build.sh
          sha256sum gubbio1151.gba | tee gubbio1151.gba.sha256
          echo "### SHA-256 della ROM" >> "$GITHUB_STEP_SUMMARY"
          echo '`'"$(cut -d' ' -f1 gubbio1151.gba.sha256)"'`' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2, node24
        with:
          name: gubbio1151-rom
          path: |
            gubbio1151.gba
            gubbio1151.gba.sha256
            gubbio1151.elf
          if-no-files-found: error
